<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>water4 3D 모델 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f4; --panel:#ffffffee; --ink:#18202a; --mute:#66717e; --line:#d9dee4; --accent:#0f6fd6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14181d; --panel:#1d232bee; --ink:#e6ebf0; --mute:#8d98a5; --line:#2e3640; --accent:#5aa9ff; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;overflow:hidden}
  #view{position:fixed;inset:0}
  canvas{display:block;outline:none}
  .panel{position:fixed;top:12px;left:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);
    backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;font-size:13px;box-shadow:0 6px 24px #0000001a}
  .panel.collapsed .body{display:none}
  h1{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sub{color:var(--mute);font-size:12px;margin:4px 0 10px}
  h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px;font-weight:500}
  .row{display:grid;grid-template-columns:18px 12px 1fr 64px;align-items:center;gap:7px;padding:4px 2px;border-radius:6px}
  .row:hover{background:#8881}
  .row.hl{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .row input[type=range]{width:64px}
  .dot{width:12px;height:12px;border-radius:3px;border:1px solid #0003}
  .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .name small{color:var(--mute);font-family:"JetBrains Mono",monospace;font-size:10.5px;margin-left:4px}
  .btns{display:flex;flex-wrap:wrap;gap:6px}
  button{font:inherit;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ctl{display:grid;grid-template-columns:44px minmax(0,1fr) 52px;align-items:center;gap:8px;margin:6px 0}
  .ctl span:last-child{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mute);text-align:right}
  input[type=range]{accent-color:var(--accent)}
  select{font:inherit;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px}
  #toggle{padding:2px 8px}
  #info{position:fixed;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;
    font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.55;color:var(--mute);min-width:210px;pointer-events:none}
  #info b{color:var(--ink);font-weight:500}
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:var(--mute);background:var(--panel);
    border:1px solid var(--line);border-radius:20px;padding:5px 12px;pointer-events:none}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--mute)}
  @media (max-width:640px){ .panel{width:calc(100% - 24px)} #hint{display:none} #info{bottom:auto;top:12px;right:12px;display:none} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="view"></div>
<div id="loading">모델 불러오는 중…</div>

<div class="panel" id="panel">
  <h1>water4 · 1/4 모형 <button id="toggle" title="패널 접기">–</button></h1>
  <div class="body">
    <div class="sub">와류식 자기세정 집수정 · 부품 11개 · 단위 mm</div>

    <h2>부품 (표시 · 불투명도)</h2>
    <div id="parts"></div>
    <div class="btns" style="margin-top:6px">
      <button id="allOn">모두 표시</button>
      <button id="inner">내부만 보기</button>
    </div>

    <h2>시점</h2>
    <div class="btns">
      <button data-view="iso">등각</button>
      <button data-view="front">정면</button>
      <button data-view="side">측면</button>
      <button data-view="top">평면</button>
      <button id="fit">맞춤</button>
    </div>

    <h2>보기</h2>
    <div class="ctl"><span>분해</span><input type="range" style="width:100%" id="explode" min="0" max="1" step="0.01" value="0"><span id="explodeV">0%</span></div>
    <div class="ctl"><span>단면</span>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="clipAxis"><option value="off">끔</option><option value="x">X</option><option value="z">Z</option><option value="y">Y (높이)</option></select>
        <input type="range" id="clip" min="0" max="1" step="0.002" value="0.5" style="flex:1;min-width:0">
      </div><span id="clipV">–</span></div>
    <div class="btns" style="margin-top:8px">
      <button id="spin">스크류 회전</button>
      <button id="wire">와이어프레임</button>
      <button id="grid" class="on">격자</button>
      <button id="auto">자동 회전</button>
    </div>
  </div>
</div>

<div id="info"></div>
<div id="hint">드래그 회전 · 우클릭/두 손가락 이동 · 휠 확대 · 부품 클릭 시 정보</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const PARTS = {
  '01_structure_wall': { ko:'구조 벽체',      color:0xb9c2cc, op:0.35 },
  '02_net':            { ko:'거름망',         color:0x4e9a6a, op:1 },
  '03_acrylic_tube':   { ko:'아크릴 관',      color:0x8fd0f2, op:0.35 },
  '04_screw_shaft':    { ko:'스크류 축',      color:0x5b6470, op:1 },
  '05_screw_blade':    { ko:'스크류 날개',    color:0xe0892b, op:1 },
  '06_sump':           { ko:'수거함',         color:0x7a64c8, op:1 },
  '07_sump_cover':     { ko:'수거함 덮개',    color:0xa592e6, op:0.6 },
  '08_inlet_duct':     { ko:'유입 덕트',      color:0x2f86d6, op:1 },
  '09_outlet_pipe':    { ko:'배출관',         color:0xd34f4f, op:1 },
  '99_frame_reference':{ ko:'기준 프레임',    color:0x9aa3ad, op:1, off:true },
  'Cube':              { ko:'상판 (Cube)',    color:0xc9d1d9, op:0.25 },
};
const MOVING = ['04_screw_shaft','05_screw_blade'];

// ---------- decode embedded model ----------
async function loadModel(){
  const { meta, data } = JSON.parse(document.getElementById('model').textContent);
  const bin = Uint8Array.from(atob(data), c => c.charCodeAt(0));
  const ds = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(ds).arrayBuffer();
  return meta.map(m => {
    const pos = new Float32Array(buf, m.pOff, m.pLen);
    const ind = m.big ? new Uint32Array(buf, m.iOff, m.iLen) : new Uint16Array(buf, m.iOff, m.iLen);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setIndex(new THREE.BufferAttribute(ind, 1));
    return { name:m.name, tris:m.iLen/3, geo: toCreasedNormals(g, Math.PI/6) };
  });
}

// ---------- scene ----------
const host = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.001, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8090a0, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(1, 2, 1.4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-1.2, 0.6, -1); scene.add(fill);

const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const grid = new THREE.GridHelper(1, 20, dark?0x3a4450:0xb8c0c9, dark?0x262d36:0xd6dce2);
scene.add(grid);

const clipPlane = new THREE.Plane(new THREE.Vector3(-1,0,0), 0);
const items = [];         // {name, mesh, mat, base(Vector3), dir(Vector3)}
const root = new THREE.Group(); scene.add(root);
let box, center, size;

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- build ----------
const parts = await loadModel();
box = new THREE.Box3();
for (const p of parts){
  p.geo.computeBoundingBox();
  if (p.name !== '99_frame_reference') box.union(p.geo.boundingBox);
}
center = box.getCenter(new THREE.Vector3()); size = box.getSize(new THREE.Vector3());
root.position.set(-center.x, -box.min.y, -center.z);   // centre on grid, sit on floor
grid.scale.setScalar(Math.max(size.x, size.z) * 2.2);

for (const p of parts){
  const cfg = PARTS[p.name] || { ko:p.name, color:0x999999, op:1 };
  const mat = new THREE.MeshStandardMaterial({
    color: cfg.color, roughness:0.55, metalness:0.05, side:THREE.DoubleSide,
    transparent: cfg.op < 1, opacity: cfg.op, depthWrite: cfg.op >= 1, clippingPlanes: [],
  });
  const mesh = new THREE.Mesh(p.geo, mat);
  mesh.name = p.name; mesh.visible = !cfg.off;
  // geometry pivot: put mesh origin at part centre so screw can spin about its axis
  const c = p.geo.boundingBox.getCenter(new THREE.Vector3());
  p.geo.translate(-c.x, 0, -c.z);
  mesh.position.set(c.x, 0, c.z);
  const dir = c.clone().sub(center); dir.y = 0;
  if (MOVING.includes(p.name) || p.name==='03_acrylic_tube' || p.name==='02_net') dir.set(0, 0, 0);
  const lift = { '01_structure_wall':1.15, 'Cube':1.7, '07_sump_cover':0.45 }[p.name];
  if (lift) dir.y = size.y * lift;
  root.add(mesh);
  items.push({ name:p.name, cfg, mesh, mat, base:mesh.position.clone(), dir, tris:p.tris });
}
document.getElementById('loading').remove();

// ---------- parts UI ----------
const partsEl = document.getElementById('parts');
const hex = n => '#' + n.toString(16).padStart(6,'0');
for (const it of items){
  const row = document.createElement('div'); row.className = 'row'; it.row = row;
  row.innerHTML = `<input type="checkbox" ${it.mesh.visible?'checked':''}>
    <span class="dot" style="background:${hex(it.cfg.color)}"></span>
    <span class="name" title="${it.name}">${it.cfg.ko}<small>${it.name.split('_')[0]}</small></span>
    <input type="range" min="0.05" max="1" step="0.05" value="${it.cfg.op}">`;
  const [cb, , nm, op] = row.children;
  cb.onchange = () => { it.mesh.visible = cb.checked; };
  op.oninput = () => setOpacity(it, +op.value);
  nm.onclick = () => select(it);
  it.cb = cb; it.op = op;
  partsEl.appendChild(row);
}
function setOpacity(it, v){
  it.mat.opacity = v; it.mat.transparent = v < 1; it.mat.depthWrite = v >= 1; it.mat.needsUpdate = true; it.op.value = v;
}
document.getElementById('allOn').onclick = () => items.forEach(it => {
  const on = !it.cfg.off; it.mesh.visible = on; it.cb.checked = on; setOpacity(it, it.cfg.op);
});
document.getElementById('inner').onclick = () => items.forEach(it => {
  const hide = ['01_structure_wall','Cube','99_frame_reference','07_sump_cover'].includes(it.name);
  it.mesh.visible = !hide; it.cb.checked = !hide;
});

// ---------- info / selection ----------
const info = document.getElementById('info');
const mm = v => (v*1000).toFixed(0);
function showInfo(it){
  if (!it){
    info.innerHTML = `<b>전체 외형</b><br>W ${mm(size.x)} × D ${mm(size.z)} × H ${mm(size.y)} mm<br>삼각형 ${items.reduce((s,i)=>s+i.tris,0).toLocaleString()}개`;
    return;
  }
  const b = it.mesh.geometry.boundingBox, s = b.getSize(new THREE.Vector3());
  info.innerHTML = `<b>${it.cfg.ko}</b> · ${it.name}<br>W ${mm(s.x)} × D ${mm(s.z)} × H ${mm(s.y)} mm<br>삼각형 ${it.tris.toLocaleString()}개`;
}
let selected = null; const savedEmissive = new Map();
function select(it){
  if (selected){ selected.mat.emissive.setHex(0); selected.row.classList.remove('hl'); }
  selected = (selected === it) ? null : it;
  if (selected){ selected.mat.emissive.setHex(0x223355); selected.row.classList.add('hl'); }
  showInfo(selected);
}
showInfo(null);

const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2(); let down;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 4) return;
  ptr.set(e.clientX/innerWidth*2-1, -e.clientY/innerHeight*2+1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(items.filter(i=>i.mesh.visible).map(i=>i.mesh), false)
    .filter(h => !clipOn() || clipPlane.distanceToPoint(h.point) >= 0);
  // prefer opaque parts behind see-through shells
  const h = hits.find(h => h.object.material.opacity >= 0.5) || hits[0];
  if (h) select(items.find(i => i.mesh === h.object)); else if (selected) select(selected);
});

// ---------- views ----------
const R = () => size.length() * 1.35;
function setView(v){
  const t = new THREE.Vector3(0, size.y/2, 0), d = R();
  const dirs = { iso:[1,0.8,1.15], front:[0,0.05,1], side:[1,0.05,0], top:[0,1,0.0001] };
  const dv = new THREE.Vector3(...dirs[v]).normalize().multiplyScalar(d);
  camera.position.copy(t).add(dv); controls.target.copy(t); controls.update();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
document.getElementById('fit').onclick = () => setView('iso');
setView('iso');

// ---------- explode ----------
const ex = document.getElementById('explode');
ex.oninput = () => {
  const k = +ex.value; document.getElementById('explodeV').textContent = Math.round(k*100)+'%';
  for (const it of items) it.mesh.position.copy(it.base).addScaledVector(it.dir, k*1.6);
};

// ---------- section ----------
const axisSel = document.getElementById('clipAxis'), clipR = document.getElementById('clip'), clipV = document.getElementById('clipV');
const clipOn = () => axisSel.value !== 'off';
function updateClip(){
  const a = axisSel.value;
  for (const it of items){ it.mat.clippingPlanes = clipOn() ? [clipPlane] : []; it.mat.needsUpdate = true; }
  if (!clipOn()){ clipV.textContent = '–'; return; }
  const t = +clipR.value;
  // world-space extents (root is offset)
  const lo = box.min.clone().add(root.position), hi = box.max.clone().add(root.position);
  const val = lo[a] + (hi[a]-lo[a]) * t;
  clipPlane.normal.set(a==='x'?-1:0, a==='y'?-1:0, a==='z'?-1:0); clipPlane.constant = val;
  clipV.textContent = mm(val - lo[a]) + ' mm';
}
axisSel.onchange = updateClip; clipR.oninput = updateClip;

// ---------- toggles ----------
const tog = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { b.classList.toggle('on'); fn(b.classList.contains('on')); }; };
let spinning = false;
tog('spin', on => spinning = on);
tog('wire', on => items.forEach(i => i.mat.wireframe = on));
tog('grid', on => grid.visible = on);
tog('auto', on => { controls.autoRotate = on; controls.autoRotateSpeed = 1.2; });
document.getElementById('toggle').onclick = e => {
  const p = document.getElementById('panel'); p.classList.toggle('collapsed');
  e.target.textContent = p.classList.contains('collapsed') ? '+' : '–';
};

// ---------- loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (spinning) for (const it of items) if (MOVING.includes(it.name)) it.mesh.rotation.y -= dt * 2.4;
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
